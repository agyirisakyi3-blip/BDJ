name: CI

on:
  push:
    branches: [main, master, v2-supabase]
  pull_request:

jobs:
  frontend:
    name: Frontend lint + production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build (production)
        run: npm run build

      - name: npm audit (frontend)
        run: npm audit
        continue-on-error: true

  e2e:
    name: Frontend E2E tests (Puppeteer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          npm --prefix frontend ci
          npm ci

      - name: Build (production)
        run: npm run build

      - name: Run E2E tests
        run: node tests/run.js

      - name: Upload test output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-errors
          path: tests/