name: CD - Deploy Production

on:
  push:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-deploy-creds:
    name: Check deploy credentials
    runs-on: ubuntu-latest
    outputs:
      has_clasp: ${{ steps.clasp.outputs.has }}
      has_vercel: ${{ steps.vercel.outputs.has }}
    steps:
      - id: clasp
        env:
          CREDS: ${{ secrets.CLASPRC_JSON }}
        run: echo "has=$([ -n \"$CREDS\" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - id: vercel
        env:
          TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: echo "has=$([ -n \"$TOKEN\" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  deploy-backend:
    name: Deploy Apps Script backend (clasp)
    needs: check-deploy-creds
    if: needs.check-deploy-creds.outputs.has_clasp == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install clasp
        run: npm install -g @google/clasp

      - name: Restore clasp credentials
        run: |
          echo "$CLASPRC_JSON" | base64 -d > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}

      - name: Push code to Apps Script project
        run: clasp push -f

      - name: Create new deployment version
        id: version
        run: |
          OUT=$(clasp version "CI deploy ${GITHUB_SHA}")
          echo "$OUT"
          echo "version=$(printf '%s' "$OUT" | grep -oE '[0-9]+' | tail -1)" >> "$GITHUB_OUTPUT"

      - name: Point production deployment at the new version
        run: |
          clasp deploy -i "AKfycbzo9vVXXha0KA-qu9Bt4OVl0YdJUJRX6blG6qfQtyU8qHJKdE5LlNMErWsIJGmQJHyH_Q" \
            -V "${{ steps.version.outputs.version }}" \
            -d "CI deploy ${GITHUB_SHA}"

      - name: Verify deployments
        run: clasp deployments

  deploy-frontend:
    name: Deploy frontend to Vercel
    needs: check-deploy-creds
    if: needs.check-deploy-creds.outputs.has_vercel == 'true'
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_Zh8eIwDwXe9zypGZ0uvzPyBc
      VERCEL_PROJECT_ID: prj_CJSKanTAIPzhr1EfHgSk5glqkk7m
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build (production)
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}