<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Office QR Generator</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body {
      background: linear-gradient(170deg, #0a1525, #111a2e 50%, #0e1529) fixed;
      color: #f0f4f8;
    }
    .gen {
      max-width: 460px;
      margin: 0 auto;
      padding: 24px 16px;
    }
    h1 { margin: 0 0 6px; font-size: 20px; font-weight: 700; }
    .gen .hint { text-align: left; }
    .gen .card { background: transparent; box-shadow: none; padding: 0; }
    #qrcode {
      display: inline-block;
      padding: 16px;
      background: #fff;
      border-radius: 16px;
      margin-top: 14px;
    }
    .qrbox { text-align: center; }
    label { color: #7e8da6; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.4px; }
    .btn-row { display: flex; gap: 8px; margin-top: 14px; }
    .btn-row .ghost-btn { flex: 1; }
    @media print {
      .controls, .btn-row { display: none; }
      body { background: #fff; }
      .gen { padding: 0; }
      h1 { color: #000; }
      .gen .hint { display: none; }
    }
  </style>
</head>
<body>
  <div class="gen">
    <h1>Office QR Generator</h1>
    <p class="hint">Generates the QR to print and post at the office entrance.
      The token must exactly match <code>qrSecret</code> in the Config sheet of your Google Sheet.</p>

    <div class="controls">
      <label for="tenant">Tenant code <span style="color:#64748b">(optional)</span></label>
      <input id="tenant" type="text" placeholder="e.g. acme" autocomplete="off">
      <label for="secret">Secret token</label>
      <input id="secret" type="text" placeholder="Paste qrSecret from the Config sheet" autocomplete="off">
      <button id="gen" class="primary-btn">Generate QR</button>
    </div>

    <div class="qrbox">
      <div id="qrcode"></div>
      <p id="note" class="hint"></p>
      <div class="btn-row">
        <button id="dl" class="ghost-btn">Download PNG</button>
        <button id="print" class="ghost-btn">Print</button>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script>
    (function () {
      var qr = null;

      function make() {
        var v = document.getElementById('secret').value.trim();
        var t = document.getElementById('tenant').value.trim();
        var text = t ? t + '|' + v : v;
        var box = document.getElementById('qrcode');
        var note = document.getElementById('note');
        box.innerHTML = '';
        if (!v) { note.textContent = 'Enter the secret first.'; return; }
        if (!window.QRCode) { note.textContent = 'QR library failed to load (offline?). Retry with a connection.'; return; }
        qr = new QRCode(box, { text: text, width: 512, height: 512, correctLevel: QRCode.CorrectLevel.H });
        note.textContent = 'Keep this code private - anyone who scans it can check in at the office.';
      }

      function download() {
        var canvas = document.querySelector('#qrcode canvas');
        if (!canvas) return;
        var a = document.createElement('a');
        a.download = 'office-qr.png';
        a.href = canvas.toDataURL('image/png');
        document.body.appendChild(a);
        a.click();
        a.remove();
      }

      document.getElementById('gen').addEventListener('click', make);
      document.getElementById('secret').addEventListener('keydown', function (e) {
        if (e.key === 'Enter') make();
      });
      document.getElementById('dl').addEventListener('click', download);
      document.getElementById('print').addEventListener('click', function () { window.print(); });
    })();
  </script>
</body>
</html>
